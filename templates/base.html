<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ title or "arthouse" }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ asset('css/app.css') }}">
    <script src="{{ asset('js/htmx.min.js') }}" defer></script>
  </head>
  <body class="flex min-h-screen flex-col bg-paper font-sans text-ink antialiased">
    <header class="border-b border-line">
      <div class="mx-auto flex w-full max-w-4xl items-center justify-between px-5 py-3">
        <a href="{{ url_for('index') }}" class="font-semibold tracking-tight">arthouse</a>
        <nav class="flex items-center gap-4 text-sm">
          <a href="{{ url_for('library') }}" class="text-muted hover:text-accent hover:underline">Library</a>
        </nav>
      </div>
    </header>
    <main class="mx-auto w-full max-w-4xl flex-1 px-5 pt-10 pb-16">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
